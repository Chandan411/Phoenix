services:
  - type: web
    name: phoenix-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: FRONTEND_URL
        value: https://phoenix-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://phoenix-frontend.onrender.com,http://localhost:5173,http://localhost:3000
  - type: static
    name: phoenix-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://phoenix-backend.onrender.com/api
