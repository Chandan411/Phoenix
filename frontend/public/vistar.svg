<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E49C" />
      <stop offset="50%" stop-color="#DFBE68" />
      <stop offset="100%" stop-color="#B8923A" />
    </linearGradient>
    <linearGradient id="gold-dark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8A248" />
      <stop offset="50%" stop-color="#9B7628" />
      <stop offset="100%" stop-color="#765616" />
    </linearGradient>

    <!-- Navy Blue Metallic Gradients -->
    <linearGradient id="navy-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22557A" />
      <stop offset="50%" stop-color="#143A57" />
      <stop offset="100%" stop-color="#0B2336" />
    </linearGradient>
    <linearGradient id="navy-dark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#153B58" />
      <stop offset="50%" stop-color="#0C2438" />
      <stop offset="100%" stop-color="#05121D" />
    </linearGradient>
  </defs>

  <!-- Centered & Scaled Logo Group (Transparent Background) -->
  <g transform="translate(2, 2) scale(0.96)">
    
    <!-- ================= GOLD LEFT HALF ================= -->
    <!-- Top Peak (Left Side) -->
    <polygon points="50,2 50,18 42,35 35,35" fill="url(#gold-light)" />
    <polygon points="50,2 35,35 31,35" fill="url(#gold-dark)" />

    <!-- Left Wing -->
    <polygon points="4,38 33,38 38,44 17,44" fill="url(#gold-light)" />
    <polygon points="4,38 17,44 33,57 27,61" fill="url(#gold-dark)" />

    <!-- Bottom-Left Wing -->
    <polygon points="27,61 33,57 26,83 18,98" fill="url(#gold-light)" />
    <polygon points="18,98 26,83 41,72 44,78" fill="url(#gold-dark)" />

    <!-- Center Interlocking "V" (Gold Ribbon) -->
    <!-- Left V Arm -->
    <polygon points="16,16 23,16 50,64 50,76" fill="url(#gold-light)" />
    <polygon points="16,16 50,76 45,76 11,16" fill="url(#gold-dark)" />
    <!-- Right V Inner Arm -->
    <polygon points="50,64 60,46 67,46 50,76" fill="url(#gold-dark)" />
    <polygon points="50,64 56,46 60,46 50,70" fill="url(#gold-light)" />

    <!-- ================= NAVY RIGHT HALF ================= -->
    <!-- Top Peak (Right Side) -->
    <polygon points="50,2 67,38 59,38 50,18" fill="url(#navy-dark)" />
    <polygon points="50,18 59,38 53,38 50,28" fill="url(#navy-light)" />

    <!-- Upper-Right "V" Accent Arm -->
    <polygon points="75,16 83,16 70,38 62,38" fill="url(#navy-light)" />
    <polygon points="83,16 88,16 74,38 70,38" fill="url(#navy-dark)" />

    <!-- Right Wing -->
    <polygon points="59,38 96,38 83,44 59,44" fill="url(#navy-light)" />
    <polygon points="96,38 73,61 67,57 83,44" fill="url(#navy-dark)" />

    <!-- Bottom-Right Wing -->
    <polygon points="73,61 82,98 74,83 67,57" fill="url(#navy-dark)" />
    <polygon points="82,98 54,78 58,72 74,83" fill="url(#navy-light)" />

  </g>
</svg>